    - generic [ref=f36e83]:
      - paragraph [ref=f36e84]: Mùa thu ở Ninh Ba hiếm khi có mưa, độ ẩm giảm xuống còn hai đến ba mươi phần trăm mang lại cảm giác thoải mái như ở vùng cao. Nhưng đây là Ninh Ba, cách cảng Hồng Kông và Ma Cao một dòng sông, khí hậu gió mùa cận nhiệt đới ẩm ướt mới là điều bình thường ở đây.
      - paragraph [ref=f36e85]: Trước khi ra ngoài sau khi trang điểm xong, trợ lý nhắc từ buổi chiều đến tối có khả năng mưa bốn mươi phần trăm, nên cẩn thận vì nhiệt độ giảm. Ứng Ẩn nghe xong cũng không để tâm lắm.
      - paragraph [ref=f36e86]: Chiếc xe bảo mẫu Alpha rẽ vào góc phố để đón người tại một studio trong căn biệt thự cổ, sau đó lập tức lên đường chạy trên xa lộ ven biển.
      - paragraph [ref=f36e87]: "\"Chị Ứng Ẩn, thật phiền chị phải đến đón em.\" Một giọng nữ vang lên. Giọng nói tuy dễ nghe, nhưng vì quá cẩn thận nên khiến người nghe cảm thấy chủ nhân của giọng nói này hơi lúng túng."
      - paragraph [ref=f36e88]: "Ứng Ẩn đưa ánh nhìn từ biển quay lại, nhìn thoáng qua cô gái bên cạnh là Nguyễn Dật: \"Không sao, công ty chưa cấp xe cho em, chị ở cũng không xa nhà em.\""
      - paragraph [ref=f36e89]: Nguyễn Dật là người mới ký hợp đồng với công ty, nghệ danh hơi khó đọc, nhưng thầy bói nói cái tên này sẽ mang lại may mắn cho cô ấy. Cô ấy vừa tốt nghiệp, hai mươi hai tuổi, đã từng đóng vai chính trong một vài bộ phim mạng nên tích lũy được chút danh tiếng.
      - paragraph [ref=f36e90]: "Nguyễn Dật lần đầu ngồi chung xe với Ứng Ẩn, không ngờ cô lại dễ nói chuyện như vậy, không hề tỏ ra kiêu căng nên cũng thả lỏng tâm lý: \"Chị, đi đến những buổi tiệc như thế này, chị không mang trợ lý hay vệ sĩ theo sao?\""
      - paragraph [ref=f36e91]: Cô dù mới bắt đầu làm ngôi sao, nhưng khi ra ngoài cũng có ba bốn người đi theo.
      - paragraph [ref=f36e92]: "Ứng Ẩn cười nhẹ: \"Thế sao em không mang theo?\""
      - paragraph [ref=f36e93]: "Nguyễn Dật chu miệng: \"Ban tổ chức không cho phép.\""
      - paragraph [ref=f36e94]: "\"Vậy là đúng rồi.\""
      - paragraph [ref=f36e95]: "\"Chị không thể đi cửa sau như ngoại lệ sao?\" Nguyễn Dật hỏi, mắt lấp lánh sự mong chờ."
      - paragraph [ref=f36e96]: Không trách cô ấy có câu hỏi như vậy.
      - paragraph [ref=f36e97]: Ứng Ẩn là ngôi sao lớn nhất của công ty họ, trước 27 tuổi đã giành được hai giải Ảnh hậu và một giải Nữ diễn viên phụ xuất sắc nhất, gần như đạt đến đỉnh cao mà một nữ diễn viên có thể đạt được. Tham dự những sự kiện như thế này cô cũng không mang theo trợ lý.
      - paragraph [ref=f36e98]: "Ứng Ẩn khẽ gật đầu: \"Chị cũng không thể.\""
      - paragraph [ref=f36e99]: "\"Chỉ là một bữa tiệc của người giàu thôi mà...\" Nguyễn Dật lẩm bẩm, \"Người giàu thì giỏi lắm sao?\""
      - paragraph [ref=f36e100]: "\"Giàu có rất giỏi mà.\" Ứng Ẩn đáp đơn giản, nhướn mày, vẻ mặt trở nên sinh động hơn."
      - paragraph [ref=f36e101]: "Nguyễn Dật cười, giọng điệu trẻ con hơn: \"Nhưng chính chị cũng rất giàu mà.\""
      - paragraph [ref=f36e102]: "\"Tiền ấy mà...\" Ứng Ẩn nhẹ nhàng nói như đang tán gẫu: \"Càng nhiều càng tốt.\""
      - paragraph [ref=f36e103]: Xa lộ ven biển kéo dài vô tận, sau một chặng đường dài, cảnh vật trước mắt cuối cùng cũng thay đổi.
      - paragraph [ref=f36e104]: Đó là một cảng du thuyền.
      - paragraph [ref=f36e105]: Dù dự báo sẽ có mưa, nhưng khoảng bốn giờ chiều ven biển vẫn không có mây đen, ánh nắng len lỏi qua tầng mây trong suốt. Trong cảng, hàng trăm chiếc thuyền buồm và du thuyền đang neo đậu, vì có cảnh báo mưa bão, những cánh buồm được buộc chặt trên cột buồm.
      - paragraph [ref=f36e106]: Đây là trò chơi của người giàu, cũng là nơi trú ẩn của họ, nhưng hai tháng trước đã được chuyển nhượng một cách kín đáo. Không ai biết chủ nhân mới của cảng này là ai.
      - paragraph [ref=f36e107]: Đến cảng du thuyền cũng có nghĩa là sắp đến khách sạn.
      - paragraph [ref=f36e108]: Trên ngọn núi đối diện cảng, những tòa nhà trắng tựa vào sườn núi, những cửa sổ lớn phản chiếu biển xanh, đèn chùm pha lê sáng rực, từ xa nhìn lại trông như những đốm lửa vàng lơ lửng trên mặt biển.
      - paragraph [ref=f36e109]: Xe lướt qua con đường nhựa ngoài cảng, Nguyễn Dật ngồi bên cửa sổ xe ngoảnh lại nhìn, mắt mở to.
      - paragraph [ref=f36e110]: Cô nhìn thấy chiếc du thuyền siêu sang đang neo tại cảng, màu trắng tinh khôi, nhìn thoáng qua không đếm được có bao nhiêu tầng.
      - paragraph [ref=f36e111]: Muốn thốt lên kinh ngạc, nhưng bên cạnh Ứng Ẩn dường như không để ý, cô đành nuốt sự ngạc nhiên vào trong.
      - paragraph [ref=f36e112]: Cùng lúc đó.
      - paragraph [ref=f36e113]: Trước cửa sổ phòng khách VIP trên tầng cao nhất, chủ nhân buổi tiệc là Trần Hữu Hằng nhận cuộc gọi.
      - paragraph [ref=f36e114]: "Giọng nói trầm ấm bên kia vang lên: \"Trời sắp mưa rồi, sân bay bên này nói sẽ có giông bão, máy bay không thể bay được.\""
      - paragraph [ref=f36e115]: "Trần Hữu Hằng cười nhẹ lắc đầu: \"Anh đừng nói với tôi là anh còn đang ở Hồng Kông.\""
      - paragraph [ref=f36e116]: Cảng Victoria Hồng Kông đông đúc du khách, gió yên biển lặng.
      - paragraph [ref=f36e117]: Từ cảng Victoria nhìn thấy những tòa nhà chọc trời ở Central san sát nhau tạo nên đường chân trời nổi tiếng thế giới, trong đó có một tòa nhà treo bảng hiệu của Tập đoàn Thương Vũ, cao 463 mét.
      - paragraph [ref=f36e118]: Ít ai biết, trong văn phòng giám đốc điều hành trên tầng thượng có một cửa sổ ngắm cảnh đại dương, người đàn ông đang gọi điện thoại đứng trước bức tường kính, nước biển xanh thẳm phản chiếu bóng dáng của anh.
      - paragraph [ref=f36e119]: Một con cá mập voi khổng lồ bơi lượn, nước biển mềm mại làm mờ đi gương mặt anh, chỉ thấy anh hơi nghiêng đầu châm một điếu thuốc, ánh lửa từ tay anh bừng sáng rồi lại tắt đi.
      - paragraph [ref=f36e120]: "\"Vẫn ở Central, vừa xong cuộc họp.\" Anh thở ra một hơi khói, thói quen chấm nhẹ tàn thuốc trắng mịn."
      - paragraph [ref=f36e121]: "\"Máy bay không bay được, thuyền lại ở cảng bên kia, anh định làm sao để đến đúng giờ?\" Trần Hữu Hằng hỏi."
      - paragraph [ref=f36e122]: "Tiếng cười trong điện thoại không rõ ràng chỉ toát ra vẻ chậm rãi: \"Hóa ra tôi cần phải đúng giờ.\""
      - paragraph [ref=f36e123]: "Cúp điện thoại, trợ lý phụ trách quan hệ công chúng của buổi tiệc hỏi: \"Anh Thương hiện đang ở trụ sở chính? Từ cầu Hồng Kông - Chu Hải - Ma Cao đến đây chẳng phải mất đến tám tiếng mới tới sao?\""
      - paragraph [ref=f36e124]: Trần Hữu Hằng không lo lắng. Anh ấy biết người đàn ông này làm việc không sơ sót, nói là sẽ trễ nhưng thực ra chỉ là câu chuyện cười.
      - paragraph [ref=f36e125]: Quả nhiên, hơn nửa tiếng sau, chiếc máy bay Gulfstream G550 được quản lý tại sân bay đã vào đường băng, chuẩn bị bay đến Ninh Ba trong cơn giông bão.
      - paragraph [ref=f36e126]: Trước cửa xoay của khách sạn, cửa xe điện Alpha mở ra, một chiếc giày cao gót mảnh mai ló ra từ chiếc váy satin đen khẽ đặt lên sàn đá cẩm thạch.
      - paragraph [ref=f36e127]: "\"Cô Ứng.\" Nhân viên lễ tân cúi chào."
      - paragraph [ref=f36e128]: "Ứng Ẩn bước xuống xe, chiếc túi xách nhỏ dự tiệc cầm gọn trước bụng. Đợi váy rũ tự nhiên xong cô mới ngẩng đầu, lịch sự khẽ gật đầu chào: \"Chào buổi chiều.\""
      - paragraph [ref=f36e129]: Nguyễn Dật từ đầu kia bước xuống xe, nhân viên lễ tân thấy cô đi giày cao gót, liền nhanh nhẹn đưa tay ra cho cô bám vào.
      - paragraph [ref=f36e130]: "Ứng Ẩn đợi cô đi theo rồi cười nói: \"Đây là lần đầu tiên em đi dự tiệc, đừng lo lắng, có vấn đề gì cứ tìm chị.\""
      - paragraph [ref=f36e131]: Nguyễn Dật biết mình có thể đến đây là nhờ vào danh tiếng và uy tín của Ứng Ẩn, cũng là do quản lý coi trọng cô ấy, muốn cô ấy có thêm kinh nghiệm. Cô ấy muốn thể hiện tốt nhưng lại không có kinh nghiệm, không nghe theo lời khuyên của quản lý, chọn một chiếc váy xòe quá to nên đi đứng phải tự ôm váy, trông thật ngây thơ vụng về.
      - paragraph [ref=f36e132]: "\"Thả váy xuống.\" Ứng Ẩn nhẹ nhàng nhắc nhở."
      - paragraph [ref=f36e133]: Không hiểu sao Nguyễn Dật cảm thấy một chút ảo giác, cô ấy cứ nghĩ từ lúc mở cửa xe bước xuống, người trước mặt lại vào trạng thái nghiêm túc.
      - paragraph [ref=f36e134]: "Nguyễn Dật nghe lời thả váy xuống rồi nhìn thấy Ứng Ẩn quay lại, mỉm cười nhẹ nhàng với nhân viên lễ tân: \"Làm phiền rồi.\""
      - paragraph [ref=f36e135]: "Không cần nói thêm lời nào, ba nhân viên lễ tân lập tức quỳ xuống chỉnh sửa phần đuôi váy xòe của Nguyễn Dật. Nhân viên PR đợi sẵn để dẫn đường, vừa thấy mọi việc xong xuôi đã vội vàng mời: \"Hai vị xin mời theo lối này.\""
      - paragraph [ref=f36e136]: Lối đi VIP vô cùng yên tĩnh, thang máy riêng có mùi hương lạnh lẽo, bốn mặt cabin là kim loại bạc phản chiếu bóng dáng ba người. Nguyễn Dật lén nhìn trong hình phản chiếu, Ứng Ẩn dù chỉ mặc chiếc váy dài satin đen nhưng dáng người vẫn rất đẹp.
      - paragraph [ref=f36e137]: "Thang máy lên đến tầng của phòng tiệc, nhân viên PR giới thiệu: \"Còn vài khách chưa đến, cô Ứng, chúng tôi đã chuẩn bị phòng nghỉ riêng cho cô, có cần tôi dẫn cô qua đó không?\""
      - paragraph [ref=f36e138]: Ánh mắt Ứng Ẩn dò hỏi nhìn Nguyễn Dật. Có lẽ vì Nguyễn Dật chưa đủ nổi tiếng nên không có phòng nghỉ riêng, chỉ có thể "dựa nhờ", để tránh cô ấy lúng túng, Ứng Ẩn mới chủ động mời.
      - paragraph [ref=f36e139]: "Nguyễn Dật vừa mở miệng, chưa kịp nói gì đã có một giọng nam khác xen vào: \"Tiểu Ứng.\""
      - paragraph [ref=f36e140]: Ứng Ẩn cứng người.
      - paragraph [ref=f36e141]: "Đó chỉ là một khoảnh khắc rất ngắn và vô thức, ngay sau khoảnh khắc đó, cô đã điều chỉnh xong biểu cảm, mỉm cười lịch sự: \"Sếp Tống hóa ra cũng ở đây.\""
      - paragraph [ref=f36e142]: Tống Thời Chương là nhà sản xuất nổi tiếng trong giới.
      - paragraph [ref=f36e143]: "Anh ta mặc vest chỉnh tề, một tay đút túi quần, tay kia phất nhẹ với nhân viên PR: \"Dẫn cô này đi nghỉ ngơi trước, ở đây có tôi lo.\""
      - paragraph [ref=f36e144]: Khi mọi người đi hết, Tống Thời Chương chìa tay mời Ứng Ẩn khoác tay anh.
      - paragraph [ref=f36e145]: "\"Hôm nay sao em mặc đơn giản thế?\" Anh hỏi, sau đó liếc nhìn vai và xương quai xanh dưới hai dây đeo mảnh của cô."
      - paragraph [ref=f36e146]: "Đây là phép xã giao nên không có lý do gì để từ chối, Ứng Ẩn chỉ có thể mỉm cười nhẹ nhàng khoác tay rồi đáp: \"Dù sao cũng không phải là thảm đỏ.\""
      - paragraph [ref=f36e147]: "Tống Thời Chương cười nhạt: \"Em nói đúng, cô gái đi cùng em không thông minh như em.\""
      - paragraph [ref=f36e148]: "\"Cô ấy còn trẻ.\" Ứng Ẩn không phủ nhận, dù khoác tay Tống Thời Chương nhưng vẫn giữ khoảng cách khách sáo với anh."
      - paragraph [ref=f36e149]: Cửa bọc đệm dày mở ra, phòng tiệc rộng rãi và sáng sủa có thể nhìn thấy rõ ràng. Ứng Ẩn liếc qua, cô nhận ra một số gương mặt quen thuộc trong giới giải trí, không nhiều, đều là những ngôi sao xinh đẹp, có lẽ cũng được mời đến để làm điểm nhấn.
      - paragraph [ref=f36e150]: Có những tiếng xì xào khe khẽ sau tiếng bước chân.
      - paragraph [ref=f36e151]: "\"Lại làm bạn nhảy nữ của Tống Thời Chương à?\""
      - paragraph [ref=f36e152]: "\"Sếp Tống thích kiểu này, xem ra công sức của người có tâm tư không uổng phí rồi.\""
      - paragraph [ref=f36e153]: "\"Người có tâm tư mà cậu nói là ai thế?\" Có người cười che miệng."
      - paragraph [ref=f36e154]: "\"Tống Thời Chương đang độ tuổi phong độ, ngoại hình cũng tạm được, nếu thật lòng muốn cho một danh phận, chẳng phải là được làm bà chủ sao?\""
      - paragraph [ref=f36e155]: Ứng Ẩn nghe rõ mồn một nhưng mặt không thay đổi sắc, chỉ là hai hàng lông mày mảnh nhíu lại tỏ vẻ khó chịu rồi nhanh chóng trở lại bình thường.
      - paragraph [ref=f36e156]: "\"Biết em sẽ đến từ sớm nên tôi chuẩn bị một món quà cho em.\" Tống Thời Chương lờ đi những tiếng nói đó, hạ mắt nhìn Ứng Ẩn nói."
      - paragraph [ref=f36e157]: "\"Ừm?\" Ứng Ẩn ngẩn người, cảm giác không lành nổi lên trong lòng: \"Quà gì?\""
      - paragraph [ref=f36e158]: "\"Một bộ đồ cao cấp mới ra mắt ở Tuần lễ Thời trang Paris, tôi nghĩ em xứng đáng là người đầu tiên trên thế giới mặc nó.\""
      - paragraph [ref=f36e159]: "Gương mặt hoàn hảo của Ứng Ẩn cuối cùng cũng xuất hiện chút gượng gạo, nụ cười của cô cứng lại: \"Món quà quý giá như vậy, hay là để dành cho lễ hội điện ảnh tháng sau...\""
      - paragraph [ref=f36e160]: "\"Tôi muốn em mặc nó hôm nay.\" Tống Thời Chương giảm tốc độ nói, nhấn mạnh lại một lần: \"Làm bạn gái của tôi phải có đãi ngộ như vậy.\""
      - paragraph [ref=f36e161]: "\"Nhưng phụ kiện...\" Ứng Ẩn vắt óc tìm lý do."
      - paragraph [ref=f36e162]: Mọi người đều thấy cô mặc bộ này vào, nếu giữa chừng đổi lại một bộ trang phục cao cấp mùa xuân hè mới nhất, ai cũng biết là do Tống Thời Chương tặng.
      - paragraph [ref=f36e163]: Tại sao muốn tặng quà lại không tặng sớm mà phải đợi cô xuất hiện mới tặng?
      - paragraph [ref=f36e164]: Hắn cố ý.
      - paragraph [ref=f36e165]: Tống Thời Chương đáng ghét.
      - paragraph [ref=f36e166]: "Ứng Ẩn âm thầm chửi rủa trong lòng, ngẩng mặt lên, mắt đầy vẻ đáng thương: \"Thay đồ phiền phức lắm, tóc cũng sẽ rối, có khi son môi dính vào váy...\""
      - paragraph [ref=f36e167]: "\"Không quan trọng.\" Tống Thời Chương cắt ngang, dừng một lát rồi giọng trầm xuống: \"Em có biết khách mời hôm nay là ai không?\""
      - paragraph [ref=f36e168]: "\"Là ai?\""
      - paragraph [ref=f36e169]: "Tống Thời Chương không trả lời ngay, giơ một ngón tay nhẹ nhàng chạm vào môi Ứng Ẩn: \"Lễ phục và trang sức tôi đã cho người đặt trong phòng nghỉ của em. Tôi muốn em mặc lễ phục của tôi, trở thành người đẹp nhất đứng bên cạnh tôi đêm nay.\""
      - paragraph [ref=f36e170]: Mưa lớn đổ xuống.
      - paragraph [ref=f36e171]: Trời không thất hứa, đã nói chiều tối mưa thì đúng chiều tối mưa, mây đen giăng kín trời, gió lớn mưa rào làm cho cảnh sắc lúc sáu giờ tối trở nên u ám như nửa đêm. Ứng Ẩn đẩy cửa xoay ra, dưới ánh mắt của nhân viên lễ tân và bảo vệ mà bước ra ngoài. Cô vẫn chưa thay đồ, tóc búi và trang phục đều là bộ cô mặc lúc đến.
      - paragraph [ref=f36e172]: Ứng Ẩn buông tay đứng đó nhìn màn mưa xám xịt.
      - paragraph [ref=f36e173]: Xa xa, biển trời mờ mịt, không còn cảnh đẹp nữa.
      - paragraph [ref=f36e174]: Trong tiếng mưa ầm ầm, bảo vệ cứ chốc chốc lại liếc nhìn cô, họ không hiểu sao nữ diễn viên xinh đẹp này lại ra ngoài vào lúc này.
      - paragraph [ref=f36e175]: Rồi anh ta mở to mắt chứng kiến cảnh tượng khó quên trong đời.
      - paragraph [ref=f36e176]: Cái bóng mảnh mai mặc váy đuôi cá dây mảnh bất ngờ bước vào màn mưa mà không báo trước.
      - paragraph [ref=f36e177]: "\"Cô Ứng!\" Bảo vệ thất thanh."
      - paragraph [ref=f36e178]: "Ứng Ẩn giơ tay ngăn anh ta tiến lại. Giọng cô gần như bị mưa nuốt chửng, cô bình tĩnh nói: \"Không sao đâu.\""
      - paragraph [ref=f36e179]: Cô chỉ muốn tắm mưa. Nếu có thể bị sốt cao rồi ngất tại chỗ thì càng tốt, nhưng vì để giữ dáng, cô đã tập luyện nhiều năm, nếu muốn đột nhiên ngất đi e là khó. Vậy coi như là xả stress. Tốt nhất là làm nhòe lớp trang điểm, rối tóc, làm hỏng bộ váy để Tống Thời Chương bực mình vì cô không biết điều.
      - paragraph [ref=f36e180]: Nhưng có lúc cô lại quá biết điều.
      - paragraph [ref=f36e181]: Nhân viên đón tiếp dưới lầu đã rút hết, nghĩa là khách mời đã đến đầy đủ. Ứng Ẩn yên tâm sẽ không còn ai đến nữa.
      - paragraph [ref=f36e182]: Cũng phải, ai dám đến trễ trong bữa tiệc của Trần Hữu Hằng?
      - paragraph [ref=f36e183]: Mưa thu làm Ninh Ba hạ nhiệt, mưa lạnh buốt thấm vào tóc và da, Ứng Ẩn vừa chửi Tống Thời Chương vừa cứng đầu chống lại những cơn run trong người.
      - paragraph [ref=f36e184]: Cô không để ý, dưới màn trời xám xịt, chiếc Maybach mui bạc dài hơn xe thường đang vòng qua đảo phun nước, từ từ tiến vào sảnh.
      - paragraph [ref=f36e185]: Chiếc xe sang trọng lướt đi êm ru, trong xe còn yên tĩnh hơn, ngăn cách hoàn toàn âm thanh mưa rơi, chỉ còn chút tiếng ồn trắng như âm thanh giúp ngủ. Cần gạt nước làm việc liên tục để gạt đi nước trên kính chắn gió.
      - paragraph [ref=f36e186]: Xe tiến vào hành lang, tiếng ồn biến mất, báo hiệu cho người ngồi phía sau đã đến nơi. Người đàn ông đang nhắm mắt dưỡng thần cảm nhận được điều này liền mở mắt.
      - paragraph [ref=f36e187]: "Ánh mắt liếc qua, giọng nói tiếng Quảng Đông vang lên: \"Dừng lại.\""
      - paragraph [ref=f36e188]: "Xe dừng ngay, tài xế tóc đã điểm sương quay mặt hỏi bằng tiếng Quảng Đông: \"Sao vậy?\""
      - paragraph [ref=f36e189]: "Người đàn ông trong xe nhìn cô vài giây rồi thu lại ánh mắt, không biểu lộ cảm xúc. Anh trở lại dáng vẻ lạnh lùng, đôi mắt khẽ hạ rồi dặn dò đơn giản: \"Mang cho cô ấy một chiếc ô.\""
      - paragraph [ref=f36e190]: Tài xế liếc nhìn cái bóng đó rồi dứt khoát nhận lệnh.
      - paragraph [ref=f36e191]: Ông ta xuống xe lấy một chiếc ô dài màu đen, khi chuẩn bị đi, không ngờ cửa sổ sau xe lại hạ xuống một nửa, bên trong chậm rãi đưa ra một tấm chăn len mỏng. Bàn tay cầm tấm chăn có ngón tay dài với khớp xương đều đặn được nền len đỏ sẫm làm nổi bật, như một chiếc quạt ngọc gãy.
      - paragraph [ref=f36e192]: "Giọng nói trong xe luôn trầm ổn, không lộ chút cảm xúc thừa: \"Cẩn thận cảm lạnh.\""
      - paragraph [ref=f36e193]: Đến khi có người cầm ô bước lại gần, Ứng Ẩn mới nhận ra sự thất thố của mình bị người khác nhìn thấy, nhưng đã muốn tránh cũng không kịp. Người đó đến gần cô, dưới ô là gương mặt khoảng sáu mươi tuổi, hai bên tóc mai đã bạc.
      - paragraph [ref=f36e194]: Ứng Ẩn thở phào nhẹ nhõm.
      - paragraph [ref=f36e195]: Tuổi này chắc không nhận ra cô, huống chi lúc này mặt cô đầy nước mưa, chắc chắn còn đáng sợ hơn ma.
      - paragraph [ref=f36e196]: Đối phương mở chiếc ô dài khác rồi đưa cho Ứng Ẩn.
      - paragraph [ref=f36e197]: Đó là chiếc ô tay cầm bằng gỗ óc chó đen ánh lên vẻ ấm áp, tỏa ra sự trang trọng không tương xứng với một chiếc ô.
      - paragraph [ref=f36e198]: Ứng Ẩn theo bản năng cầm lấy, cô còn đang ngẩn ngơ ngay sau đó tay cô lại bị nhét vào tấm len mềm mại và ấm áp.
      - paragraph [ref=f36e199]: "\"Trời mưa lạnh.\" Người ấy nói."
      - paragraph [ref=f36e200]: "\"Cảm ơn.\" Ứng Ẩn không hỏi thêm mà chỉ cảm ơn."
      - paragraph [ref=f36e201]: Giữa không khí ẩm ướt của cơn mưa nhiệt đới, Ứng Ẩn khẽ ngửi, cô nhận thấy một mùi hương thoang thoảng. Có lẽ không thể gọi là nước hoa, vì nó khó tả, không phải mùi hoa, trái cây, cũng không phải mùi gỗ, nếu phải miêu tả thì đó là một mùi "sạch sẽ".
      - paragraph [ref=f36e202]: Cảm giác sạch sẽ, trong trẻo, giống như buổi sáng ở vĩ độ cao.
      - paragraph [ref=f36e203]: "\"Là lời dặn của vị khách kia.\" Người ấy nghiêng người, mỉm cười nói tiếp: \"Anh ấy nhắn nếu muốn nghe tiếng mưa thì không cần phải để mình ướt.\""
      - paragraph [ref=f36e204]: Muốn nghe tiếng mưa thì không cần phải để mình ướt.
      - paragraph [ref=f36e205]: Ứng Ẩn cảm nhận, như lá chuối bị mưa đánh trúng phát ra âm thanh đồng cảm. Theo lời nói và ánh nhìn, cô lau nước trên lông mi nhìn về phía chiếc xe không xa.
      - paragraph [ref=f36e206]: Tán ô đen hơi ngửa lên.
      - paragraph [ref=f36e207]: Cô nhìn thấy người đàn ông ngồi sau xe.
      - paragraph [ref=f36e208]: Dù ngồi cũng thấy rõ dáng người anh ta cao ráo, cằm sắc nét và sống mũi cao.
      - paragraph [ref=f36e209]: Ánh mắt Ứng Ẩn mang theo sự biết ơn khách sáo, cô hy vọng khi ánh mắt giao nhau, có thể trả lại món nợ này ngay lập tức.
      - paragraph [ref=f36e210]: Người trong xe chỉ ngồi dựa lưng vào ghế, cơ thể thoải mái nhưng thẳng thớm, mắt khẽ nhắm, chân mày khẽ nhíu, chỉ để lại cho cô một cái nhìn im lặng và hơi bực bội.
      - paragraph [ref=f36e211]: Cô trong mưa, anh ta trong xe, một người ướt sũng, một người sạch sẽ.
      - paragraph [ref=f36e212]: Ánh sáng lờ mờ trong mưa làm góc nhìn anh ta không rõ ràng, có vẻ cao quý tự nhiên khiến người khác thấy xa cách.
      - paragraph [ref=f36e213]: Thực tế, ngay cả giúp người anh ta cũng không cần tự mình xuống xe mà chỉ cần trợ lý thân cận làm thay.
      - paragraph [ref=f36e214]: Ứng Ẩn nhìn thoáng qua, cô không liên tưởng anh ta với vị khách quan trọng trong bữa tiệc tối nay, người mà ai cũng mong chờ để tâng bốc - Cậu cả của Tập đoàn Thương Vũ.
      - paragraph [ref=f36e215]: Dù sao lời đồn đại nói Thương Thiệu dung mạo bình thường, nhưng người trong xe này, chỉ cần nhìn qua góc mặt và khí chất đã khiến người ta khó quên.
