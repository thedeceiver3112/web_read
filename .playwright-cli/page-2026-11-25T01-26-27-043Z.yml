      - generic [ref=f17e147]:
        - generic [ref=f17e148]: Giới thiệu truyện
        - generic [ref=f17e151]:
          - generic [ref=f17e153]:
            - paragraph [ref=f17e154]:
              - strong [ref=f17e155]:
                - emphasis [ref=f17e156]: "**【Vị Cao Quyền Trọng x Nữ Minh Tinh, hợp đồng tình yêu, ngôi nhà cũ bùng cháy ]**"
            - paragraph [ref=f17e157]
            - paragraph [ref=f17e158]: "Tin đồn từ một tờ báo nhỏ ở Hồng Kông: \"Người thừa kế hàng đầu của gia tộc họ Thương, Thương Thiệu, 36 tuổi chưa lập gia đình, nhiều năm không dính líu đến tin đồn tình ái, nghi ngờ bị rối loạn chức năng.\""
            - paragraph [ref=f17e159]
            - paragraph [ref=f17e161]: "Ngôi sao điện ảnh Đại lục Ứng Ẩn chỉ muốn tìm người đáng tin, nghe tin người đàn ông đối diện trị giá hàng nghìn tỷ mời cô: \"Có thể giả vờ hẹn hò với tôi một năm không? Không cần làm gì cả.\""
            - paragraph [ref=f17e162]
            - paragraph [ref=f17e163]: "\"Anh Thương coi thường người khác rồi.\""
            - paragraph [ref=f17e164]
            - paragraph [ref=f17e165]: "\"Sau thuế một tỷ.\""
            - paragraph [ref=f17e166]
            - paragraph [ref=f17e167]: Âm thanh của bánh xe bật lửa vang lên nhẹ nhàng, người đàn ông hơi nghiêng đầu châm thuốc, trong ánh sáng mờ ảo, gương mặt anh hiện lên rõ nét, thanh lịch nhưng tỏ ra hờ hững.
            - paragraph [ref=f17e168]
            - paragraph [ref=f17e169]: Ứng Ẩn bất chợt nhớ lại lần đầu tiên họ gặp nhau.
            - paragraph [ref=f17e170]
            - paragraph [ref=f17e171]: Ngày hôm đó, trời mưa như trút nước, cô vô cùng bối rối, chính anh đã bảo quản gia đưa cho cô một chiếc ô.
            - paragraph [ref=f17e172]
            - paragraph [ref=f17e173]: Mái ô đen hơi nâng lên, giữa cơn mưa dai dẳng, cô nhìn thấy bóng dáng của người đàn ông ngồi trong chiếc Maybach bạc, mắt hơi nhắm lại.
            - paragraph [ref=f17e174]
            - paragraph [ref=f17e175]: Dù chỉ là dáng vẻ im lặng, cũng khiến người ta cảm thấy cao không với tới.
            - paragraph [ref=f17e176]
            - paragraph [ref=f17e177]: Sau đó.
            - paragraph [ref=f17e178]
            - paragraph [ref=f17e179]: Tất cả mọi người đều nghĩ rằng Cậu chủ nhà họ Thương vốn dĩ thản nhiên không hề lay động trước bất cứ điều gì.
            - paragraph [ref=f17e180]
            - paragraph [ref=f17e181]: "Chỉ có Ứng Ẩn biết, anh cũng có thể trong đêm giao thừa vội vã đáp xuống một ngôi làng nghèo xa xôi chỉ để gặp cô, rũ mắt thấp giọng hỏi cô một câu: \"Nhất định phải đóng cảnh hôn này sao?\""
            - paragraph [ref=f17e182]: ............
            - paragraph [ref=f17e183]
            - paragraph [ref=f17e184]: "\"Đêm nay trăng sáng, cho phép anh yêu em.\""
            - paragraph [ref=f17e185]
            - paragraph [ref=f17e186]:
              - strong [ref=f17e187]:
                - emphasis [ref=f17e188]: "**Một câu tóm tắt:"
              - emphasis [ref=f17e189]: Cậu chủ tập đoàn và nữ minh tinh**
            - paragraph [ref=f17e190]:
              - strong [ref=f17e191]:
                - emphasis [ref=f17e192]: "**Tư tưởng:"
              - emphasis [ref=f17e193]: Tình yêu không liên quan đến tiền bạc**
            - paragraph [ref=f17e194]
            - paragraph [ref=f17e195]:
              - strong [ref=f17e196]:
                - emphasis [ref=f17e197]: "(*) Chú thích:"
            - paragraph [ref=f17e198]
            - paragraph [ref=f17e199]: Ngôi sao điện ảnh Đại lục Ứng Ẩn chỉ muốn tìm người đáng tin, vừa hay cậu chủ hào môn Hồng Kông Thương Thiệu đưa ra cành ô liu, hai người ký hợp đồng tình yêu trị giá một tỷ. Một người lăn lộn trong giới giải trí hơn mười năm, hình thành tính cách biết thời biết thế, giấu kỹ sự kiêu ngạo trong nụ cười giả ngọt ngào, một người vị cao quyền trọng, từ khi sinh ra đã đứng trên đỉnh, với thế giới đều thờ ơ. Trong trò chơi tình yêu đầy căng thẳng, hai người từ chiếm hữu đến yêu, từ giữ chừng mực đến đắm chìm, cuối cùng vượt qua khoảng cách giai cấp khổng lồ, tiến tới sự hòa quyện ngọt ngào của tâm hồn.
          - button "Xem thêm " [ref=f17e201] [cursor=pointer]:
            - text: Xem thêm
