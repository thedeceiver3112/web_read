      - generic "Nội dung chương" [ref=f29e103]:
        - article [ref=f29e105]:
          - paragraph [ref=f29e106]: "Ứng Ẩn tỉnh dậy vì một ý nghĩ thoáng qua.Chiếc ga trải giường đã ướt!Trong giấc mơ của cô chỉ nhớ mỗi việc này: người hầu sẽ đến thay ga trải giường, sẽ rất xấu hổ nếu bị phát hiện! Phải ngăn họ lại! Hoặc tìm một lý do hợp lý!Cô bật dậy ngay lập tức: \"Chúng ta đã làm đổ nước lên giường tối qua—\"Cả phòng vắng lặng.Ứng Ẩn: \"......\"Cô mặc đồ ngủ trơn mượt, ga trải giường dưới thân khô ráo, gió biển từ cửa sổ hé mở thổi vào, làm lay động rèm cửa màu trắng sáng.Nhưng đây không phải là phòng của Thương Thiệu mà là phòng ngủ phụ của cô. Trên bàn trà gần đó, những viên đá quý và kim cương vẫn được xếp theo cách cô đã làm tối qua, dưới ánh sáng trông như những viên kẹo cứng nhiều màu.Ứng Ẩn vò đầu, biểu hiện đầy đau khổ.Đau quá... Cô vừa mới ngồi dậy, cử động mạnh làm cô đau nhói, khắp cơ thể như bị rạn nứt.Bên ngoài có tiếng bước chân dừng lại ở hành lang, kèm theo tiếng nói thấp.\"Cô ấy đã tỉnh dậy chưa?\"\"Vẫn chưa nghe thấy động tĩnh.\"\"Đưa tôi phần súp.\"Cô dễ nhận ra giọng của Thương Thiệu, Ứng Ẩn cảm thấy căng thẳng, nhíu mày rồi nhanh chóng nằm xuống giường.Khi Thương Thiệu mở cửa bước vào, ga trải giường màu trắng vừa mới được đặt lại.Ứng Ẩn nằm nghiêng quay lưng về phía cửa phòng.Thương Thiệu đứng ở cửa, lặng lẽ nhìn một lúc.Anh gần như không ngủ được tối qua.Ban đầu anh nghĩ mình không quan tâm đến những chuyện như thế, cũng không nghĩ mình sẽ bị nghiện. Trong suốt ba mươi sáu năm cuộc đời, anh đã trải nghiệm qua, nhưng cảm giác chỉ trong chốc lát, không đủ để khiến anh đắm chìm. Nhưng giờ đây, anh đã nghiện.Từ việc kiêng khem đến việc đòi hỏi nhiều, sự chuyển đổi của anh nhanh đến mức không thể tin được.Mỗi trường đại học danh tiếng ở phương Tây đều có một hội anh em bí mật, những người gia nhập đều là những gia đình giàu có, \"cao quý\" và danh giá nhất trong trường, họ thừa hưởng tài sản và danh vọng từ cha ông, đồng thời cũng thừa hưởng chỗ ngồi và mối quan hệ trong hội anh em.Con cái bình dân muốn gia nhập hội anh em cần phải vượt qua nhiều thử thách và trò đùa, những trò đùa đó tấn công vào lòng tự trọng của con người, nhưng bất chấp điều đó, mỗi năm sinh viên mới vẫn cố gắng gia nhập. Bởi vì chỉ cần gia nhập hội anh em, có nghĩa là họ có thể \"cưa\" được những cô gái hàng đầu trong mỗi bữa tiệc.Tại hội anh em Cambridge, dù muốn hay không, xung quanh Thương Thiệu luôn không thiếu những người tìm đến anh. Thực lòng mà nói, về hình thể, người phương Tây có lợi thế bẩm sinh và dễ dàng hơn.Anh không phải là chưa từng thấy cơ thể đẹp, cũng không phải chưa từng bị người khác quyến rũ.Nhưng thật kỳ lạ, trong những hình ảnh đậm chất nh*c d*c tối qua, tâm trí của anh lại tách ra, trong tâm trí của anh bị phân tâm trong một giây, không phải là sự vui vẻ của t*nh d*c và c*c kh*** mà là \"vui vẻ với cô\".Sau một đêm, trái tim anh căng thẳng nhưng hormone và dopamine làm anh phấn khích. Ngồi trước máy tính tham gia cuộc họp cấp cao của tập đoàn, anh lại tràn đầy năng lượng, suy nghĩ rõ ràng, không hề có dấu vết của việc thức suốt đêm.Nhưng ba anh, Chủ tịch Hội đồng quản trị Thương Vũ đã sắc bén hỏi: \"Sao hôm nay không đi làm?\"Khi ở trụ sở chính tại Hồng Kông, Thương Thiệu hiếm khi đến muộn hay về sớm, đêm giao thừa cũng là thời điểm anh cùng Thương Cảnh Nghiệp thăm hỏi nhân viên, có thể nói, anh đã làm tròn trách nhiệm của một trưởng tử một cách tuyệt đối.Thương Cảnh Nghiệp không dễ bị lừa, Thương Thiệu không muốn để ông biết về sự tồn tại của Ứng Ẩn nên đã trả lời lạnh nhạt: \"Sốt.\"Mối quan hệ cha con đã rơi vào điểm đóng băng từ lâu.Thương Cảnh Nghiệp im lặng một lúc rồi dặn anh nghỉ ngơi tốt, đừng làm việc quá sức.Ứng Ẩn dùng kỹ năng của một ngôi sao để giả vờ ngủ, lông mày giãn ra, hô hấp đều đặn, cơ thể thư giãn, chỉ có nhịp tim trong lồng ngực tăng lên đến một trăm tám mươi.Cô không biết Thương Thiệu có nhận ra sự bất thường của cô không.Chỉ cần một cái nhìn rồi đi là tốt nhất, cô thấy ngại quá...Tuy nhiên, sự việc lại không như cô mong đợi.Ứng Ẩn trước tiên nghe thấy một tiếng động nhẹ, như có một món đồ gốm được đặt trên đầu giường sau đó là tiếng sột soạt của quần áo.Thương Thiệu từ từ cởi áo vest và cà vạt, thấy cô vất vả như vậy, anh cũng tháo cúc áo tay.Những cúc áo có đá quý bị vô ý ném vào khay kim loại, phát ra âm thanh lách cách, Ứng Ẩn cũng nuốt nước bọt theo.Anh muốn làm gì...Cô nhanh chóng hiểu ra, vì Thương Thiệu nhẹ nhàng vén chăn lên, quỳ một chân lên giường, trọng lượng đè xuống, như thể muốn nằm xuống ngủ thêm một giấc với cô.Ngủ thêm một giấc thì sẽ chết mất!Ứng Ẩn bật dậy, chăn trắng bị kéo chặt trước ngực, cô muốn cảnh báo anh đừng làm bậy nhưng lại đau đến mức thở hổn hển.Cô lại quên mất, bây giờ cô là một người bị thương, không hoạt bát lắm...Thương Thiệu cười nhẹ một tiếng, \"Chào buổi sáng.\"Anh mặc đồ chỉnh tề, chỉ là cởi áo vest và cà vạt, cúc tay áo đã được cài lại. Áo sơ mi trắng, quần tây đen như thể vừa hoàn thành công việc của tập đoàn.Ứng Ẩn đỏ mặt từ đầu đến chân. Trên làn da của cô mỗi nơi như cánh hoa mai nhạt vào đầu mùa xuân.**Cô cũng không biết tại sao mình lại đỏ mặt.Nhưng ở lại trong nhà của anh, trải qua một đêm như vậy, sáng hôm sau lại chào hỏi như không có gì xảy ra—quy trình này, cô thật sự không quen.Cô không bị mất trí, cô nhớ rõ từng âm thanh và cảnh tượng tối qua, chỉ là sau đó thật sự quá mệt mỏi mới ngất đi.\"Anh Thương...\" Giọng Ứng Ẩn nhỏ như muỗi kêu, trong lòng căng thẳng: \"Chào buổi sáng.\"Thương Thiệu ngồi xuống mép giường, một tay c*m v** túi quần sau đó lại cố ý nói: \"Đêm qua em không gọi anh như vậy.\"Ứng Ẩn nửa cắn môi đầy oán giận, nửa nhìn anh một cách buồn bã: \"Em không nhớ nữa...\"\"Vậy thì tốt.\" Thương Thiệu gật đầu, tay dừng lại trên cúc áo sơ mi, như thể sắp mở ra: \"Anh giúp em nhớ lại.\"\"Đừng đừng đừng...\" Ứng Ẩn dùng cả hai tay giữ anh lại, một tay giữ cánh tay, một tay giữ bàn tay anh mà cầu xin: \"......\"Cô lẩm bẩm hai từ rất nhỏ khiến Thương Thiệu không nghe rõ: \"Gì cơ?\"\"Sưng rồi.\"Thương Thiệu ho khan không tự nhiên, yết hầu di chuyển, giọng nói trở nên trầm hơn: \"Anh xem thử nhé?\"\"Đừng!\"\"Tối qua anh đã tắm rửa sạch rồi.\" Anh cố gắng nói một cách nhẹ nhàng, \"Sáng nay anh đã gọi bác sĩ kê thuốc, ăn sáng xong thì có thể lên lại không?\"Ứng Ẩn mặt đỏ như máu, ánh mắt lảng tránh: \"Tối qua anh đã làm gì?\"\"Ôm em đi tắm, giúp em dọn dẹp và thay ga trải giường.\"\"Anh có nói rằng...\" Ứng Ẩn nắm chặt tay, ánh mắt sáng trong đầy nghiêm túc và hy vọng: \"Chúng ta chỉ làm đổ nước lên giường thôi không?\"Thương Thiệu: \"......\"Cô có lẽ không biết chiếc ga trải giường đó rất hỗn độn, ướt sũng và đầy vết bẩn như thế nào.Anh im lặng một lúc: \"Mỗi người hầu trong nhà chắc chắc đều thông minh hơn em.\"Ứng Ẩn: \"......\"Giọng nói của cô mang theo sự thổn thức của một con vật nhỏ: \"Em không muốn gặp ai...\"Thương Thiệu thở dài bất lực nhìn cô: \"Anh đã tự tay thay ga trải giường rồi vứt nó xuống sàn, sau đó ra lệnh cho họ trực tiếp bỏ đi được chưa? Không có ai nhìn thấy.\"Trưởng tử của gia đình giàu có chưa từng tự tay phục vụ người khác tắm hay thay ga trải giường. Anh là người không động vào những thứu đó, thế giới anh thấy luôn gọn gàng, sáng sủa và sạch sẽ, cuộc sống 24 giờ đều chạy theo một quy tắc ngọt ngào, chẳng khác thiên đường là bao.Khi người hầu đến thay ga trải giường đã thấy anh đã tự tay kéo nó ra rồi chất đống ở góc tường, trong lòng họ đã sợ hãi một chút, huống chi trong phòng có mùi hương nh*c d*c nhè nhẹ càng làm cho hành động của anh thêm rõ ràng.Ứng Ẩn bĩu môi, khuôn mặt nhợt nhạt mang theo nỗi buồn sâu lắng, trên lông mi còn treo một giọt nước mắt sắp rơi.\"Em vẫn là một ngôi sao...\"Thương Thiệu vừa đau lòng vừa buồn cười, anh kéo cô lại ôm vào lòng: \"Vậy thì, tìm một bác sĩ đông y để điều trị được không?\"\"Hả?\" Ứng Ẩn không hiểu ngay lập tức.Thương Thiệu ghé sát tai cô: \"Hãy hỏi ông ấy...\" giọng nói và ánh mắt đều trầm xuống: \"Có cách nào để bạn gái không nhiều nước như vậy không?\"Ứng Ẩn gần như bị sốc, cô muốn trốn đi nhưng lại bị Thương Thiệu ôm chặt: \"Đừng làm ồn nữa, em đói không?\"Ứng Ẩn không đói nhưng khó nói ra.Thương Thiệu nhận ra rồi cười khẽ: \"Khát?\"Ứng Ẩn dùng hai tay che mặt rồi gật đầu.\"Em có muốn ăn gì ngọt không? Họ đã đặc biệt nấu cho em.\"\"Là gì vậy? Có ngon không?\"\"Sữa yến mạch với táo đỏ và tuyết yến... Hầm...\" Thương Thiệu thật sự không nhớ rõ nguyên liệu: \"Là nhựa đào, hay tổ yến nhỉ?\"Anh cầm bát lên, thìa bạc khuấy trong đó, sữa bị làm mờ đi, lẫn với nhựa đào trong suốt trông rất hấp dẫn.Ứng Ẩn cẩn thận nhận lấy rồi ăn từng ngụm một, hỏi: \"Súp này có tốt không?\"\"Bổ khí huyết.\"\"Hự...\" Ứng Ẩn bị sặc một ngụm, mặt chôn vào bát, cô cảm thấy rất xấu hổ.Thực ra người hầu còn nấu nhiều món cháo và súp khác, chú Khang còn mang ra cả nhân sâm nghìn năm quý giá nhưng Thương Thiệu lại là \"quân tử xa bếp\", không rõ cách chế biến bên trong nên đợi đến bữa trưa để cô tự nếm thử.Sau khi ăn xong súp ngọt cô lại uống một nửa chai nước, Ứng Ẩn lại bắt đầu buồn ngủ, dụi mắt nói: \"Anh Thương, em không phải là người luôn ăn uống trên giường, anh có thấy phiền không?\"Thương Thiệu cười một tiếng, anh không hiểu suy nghĩ của cô: \"Không sao đâu, nếu em muốn ăn trưa ở đây cũng được.\"\"Em muốn ngủ.\"\"Anh sẽ ở bên em?\"Ứng Ẩn căng thẳng ngồi thẳng, hai tay nắm chặt trên đùi.Có vẻ như là một sự từ chối.Thương Thiệu đứng dậy, im lặng một chút rồi dùng ngón tay vuốt tóc cô: \"Vậy em nghỉ ngơi cho tốt.\"Nói xong anh lại quay đi, nhưng đi được hai bước thì nghe thấy giọng cô hỏi từ phía sau: \"Anh không bận sao?\"Thương Thiệu dừng lại, \"Không bận.\"\"Trong công ty không có việc gì sao? Cũng không cần tiếp khách?\"\"Cả hai đều không.\"**\"Sẽ không làm anh trễ nải chứ?\" Hai tay cô ướt đẫm khi hỏi câu này.Thương Thiệu quay lại không đi nữa, từng nút áo một, vừa tháo vừa nhìn vào mắt cô mà đáp: \"Sẽ không.\"Nhiệt độ cơ thể anh nóng bỏng, trên người còn lưu lại mùi của mưa sau khi trời quang, là hơi ẩm từ nước mưa bị mặt trời làm khô.\"Âm u.\" Ứng Ẩn nói một cách không đầu không đuôi.Cô được Thương Thiệu ôm vào lòng, tựa vào cánh tay anh rồi ngửi hơi thở của cơ thể anh.\"Vừa nãy anh chơi với Rich đúng lúc có một trận âm u làm ướt người, anh ướt sũng rồi.\"Ứng Ẩn cong môi: \"Anh còn làm gì nữa?\"\"Đưa thuyền kayak không hạ bến ngày hôm qua về bến rồi buộc chặt lại. Mực nước dâng rất cao nên sau này em đừng đi muộn như vậy. Đường dốc trơn, nước sâu, có thể gặp nguy hiểm.\"Ứng Ẩn gật đầu, yên lặng một lúc rồi lại ngẩng đầu lên.Thương Thiệu cúi xuống đặt lên môi cô một nụ hôn rất nhẹ nhàng. Miệng cô rất ngọt, lưỡi lại mềm mại.\"Anh Thương, anh không mệt sao?\"\"Không mệt.\"\"Em thì mệt.\"Thương Thiệu không nhịn được cười: \"Xin lỗi nhé? Lần sau sẽ không như vậy nữa.\"Anh nắm tay Ứng Ẩn rồi xoa lưng cô, hỏi cô những chỗ đó có đau không.\"Đau, cảm giác như bị anh đánh một trận.\"Cô mềm mại và ngoan ngoãn mang theo vẻ buồn ngủ chưa tỉnh khiến trái tim Thương Thiệu trở nên mềm mại.\"Lần sau sẽ nhẹ tay hơn.\" Anh hứa.\"Thực sự là lần đầu tiên sao?\"\"Ừ.\"\"Ai dạy anh?\"Thương Thiệu cười một chút, hôn trán cô: \"Anh coi như em đang khen anh làm rất tốt.\"\"Có một tờ báo viết anh bị rối loạn chức năng đúng không?\"\"Sao vậy?\"\"Em sẽ khiếu nại họ viết tin giả, công bố thông tin chưa được xác thực, vi phạm tinh thần của việc tìm kiếm sự thật trong tin tức.\"\"Tốt thôi, hay là mua lại rồi để em dạy họ một bài học?\" Anh gần như hoàn toàn chiều theo cô.\"Còn anh thì sao?\" Ứng Ẩn mơ màng nói: \"Anh luôn lừa em.\"\"Anh chưa từng thử qua,\" Thương Thiệu nhịn cười chạm vào mũi cô: \"Biết đâu, những gì họ viết là sự thật? Không nên nói quá nhiều.\"Hơn nữa, mỗi lần cô cố gắng an ủi anh đều rất đáng yêu, làm anh không nhịn nổi mà lại trêu cô.Ứng Ẩn không nói gì mà chỉ bĩu môi.Khi cô lại sắp ngủ thì nghe thấy Thương Thiệu hỏi: \"Sao trước đây em không nói với anh, thực ra em không có kinh nghiệm?\"\"Chẳng có gì để nói, biết thì sẽ biết, không biết thì không có duyên biết, tại sao phải nói trước?\"Cuối cùng, cô vẫn ngủ quên trong vòng tay Thương Thiệu, dựa vào anh, được tay anh ôm lấy, như một bông hoa cuống dài nằm cạnh anh.*Bông hoa đó được anh ôm chặt, anh gần như không nỡ buông tay."
